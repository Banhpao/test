<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YumeAI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c10;--bg2:#13121a;--surface:#201f2d;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#e8e6f0;--muted:#7a7890;--accent:#c084fc;--accent2:#e879f9;--accent-bg:rgba(192,132,252,0.08);--pink:#f472b6;--teal:#2dd4bf;--gold:#fbbf24;--r:16px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
#api-status{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:200;padding:5px 16px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);font-size:12px;color:var(--muted);transition:all .3s}
#api-status.ok{border-color:rgba(45,212,191,.4);color:var(--teal)}
#api-status.bad{border-color:rgba(248,113,113,.3);color:#f87171}
.sidebar{width:260px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.logo{font-family:'Noto Serif JP',serif;font-size:17px;color:var(--accent)}
.search-box{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);display:flex;align-items:center;gap:8px;padding:7px 11px}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit;width:100%}
.search-box input::placeholder{color:var(--muted)}
.slabel{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;padding:12px 16px 6px}
.conv-list{overflow-y:auto;flex:1}
.conv-item{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;border-radius:var(--rs);margin:0 6px 2px;transition:background .15s;position:relative}
.conv-item:hover{background:var(--surface)}
.conv-item.active{background:var(--accent-bg)}
.conv-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.cav{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clast{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cmeta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.ctime{font-size:10px;color:var(--muted)}
.cbadge{background:var(--accent);color:#1a0a2e;font-size:9px;font-weight:500;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sfooter{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}
.uav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:white}
.uinfo{flex:1;min-width:0}
.uname{font-size:13px;font-weight:500}
.uplan{font-size:10px;color:var(--gold)}
.credit-chip{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--gold)}
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.chat-header{background:rgba(13,12,16,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:12px;z-index:10}
.char-av-wrap{position:relative}
.char-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#581c87,#1e1b4b);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid rgba(192,132,252,.25)}
.ondot{width:9px;height:9px;background:var(--teal);border:2px solid var(--bg);border-radius:50%;position:absolute;bottom:1px;right:1px}
.char-info{flex:1}
.char-name-row{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.mood-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(244,114,182,.15);color:var(--pink)}
.char-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.aff-mini{width:50px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.aff-mini-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:2px;transition:width .8s}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.mrow{display:flex;align-items:flex-end;gap:8px;animation:fu .22s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mrow.user{flex-direction:row-reverse}
.mav{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:18px}
.mav.char{background:linear-gradient(135deg,#581c87,#1e1b4b)}
.mav.uav2{background:linear-gradient(135deg,var(--accent),var(--pink));font-size:11px;font-weight:500;color:white}
.mbody{max-width:68%;display:flex;flex-direction:column;gap:3px}
.mrow.user .mbody{align-items:flex-end}
.bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.6}
.bubble.char{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;min-height:38px}
.bubble.user{background:linear-gradient(135deg,#581c87,#3b0764);border-bottom-right-radius:4px;color:#f3e8ff}
.bubble.typing{display:flex;align-items:center;gap:4px;padding:12px 16px}
.tdot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bc .9s infinite}
.tdot:nth-child(2){animation-delay:.15s}
.tdot:nth-child(3){animation-delay:.3s}
@keyframes bc{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.mtime{font-size:10px;color:var(--muted);padding:0 3px}
.bimg{border-radius:14px;overflow:hidden;border:1px solid var(--border);max-width:260px;margin-top:4px;cursor:zoom-in}
.bimg img{width:100%;display:block}
.icap{font-size:11px;color:var(--muted);padding:5px 10px;background:var(--surface)}
.datesep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:4px 0}
.datesep::before,.datesep::after{content:'';flex:1;height:1px;background:var(--border)}
.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:#f87171;font-size:12px;padding:8px 14px;border-radius:10px;text-align:center}
.suggests{padding:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
.sug-btn{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.sug-btn:hover{border-color:rgba(192,132,252,.35);color:var(--accent);background:var(--accent-bg)}
.img-bar{border-top:1px solid var(--border);padding:9px 14px;display:flex;align-items:center;gap:8px;background:rgba(13,12,16,.6);backdrop-filter:blur(10px)}
.img-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface);color:var(--muted);font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.img-toggle:hover{color:var(--accent);background:var(--accent-bg)}
.img-inp{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:7px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.img-inp:focus{border-color:rgba(192,132,252,.4)}
.img-inp::placeholder{color:var(--muted)}
.gen-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--rs);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;flex-shrink:0}
.gen-btn:hover{opacity:.85}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.chat-input-area{border-top:1px solid var(--border);padding:10px 14px 14px;background:rgba(13,12,16,.85);backdrop-filter:blur(20px)}
.input-wrap{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:6px 6px 6px 14px}
.input-wrap:focus-within{border-color:rgba(192,132,252,.35)}
.chat-inp{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;resize:none;max-height:100px;line-height:1.5;padding:4px 0}
.chat-inp::placeholder{color:var(--muted)}
.send-btn{width:34px;height:34px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:hover{opacity:.85}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.input-hint{font-size:10px;color:var(--muted);text-align:center;margin-top:6px;opacity:.6}
.gen-overlay{display:none;position:absolute;inset:0;background:rgba(13,12,16,.72);backdrop-filter:blur(4px);z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.gen-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-lbl{font-size:13px;color:var(--muted)}
.right-panel{width:240px;min-width:240px;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto}
.right-panel::-webkit-scrollbar{width:4px}
.right-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.psec{padding:16px;border-bottom:1px solid var(--border)}
.plbl{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.char-profile{text-align:center}
.big-av{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#581c87,#1e1b4b);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 10px;border:2px solid rgba(192,132,252,.2)}
.cpname{font-family:'Noto Serif JP',serif;font-size:16px}
.cpsub{font-size:11px;color:var(--muted);margin-top:2px}
.traits{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;justify-content:center}
.trait{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.srows{display:flex;flex-direction:column;gap:9px}
.srow{display:flex;flex-direction:column;gap:4px}
.slrow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.slrow span:last-child{color:var(--text)}
.strk{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.sf{height:100%;border-radius:2px;transition:width .8s}
.fa{background:linear-gradient(90deg,var(--accent),var(--pink))}
.ft{background:var(--teal)}
.fg{background:var(--gold)}
.qbtns{display:flex;flex-direction:column;gap:5px}
.qbtn{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:7px 10px;color:var(--muted);font-size:12px;font-family:inherit;cursor:pointer;width:100%;text-align:left}
.qbtn:hover{background:var(--accent-bg);color:var(--accent)}
.memory-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.memory-head .plbl{margin-bottom:0}
.memory-tools{display:flex;gap:4px}
.memory-tool{width:25px;height:25px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.memory-tool:hover{color:var(--accent);border-color:rgba(192,132,252,.35)}
.memory-list{display:flex;flex-direction:column;gap:6px}
.memory-empty{font-size:11px;line-height:1.5;color:var(--muted)}
.memory-item{display:flex;gap:6px;align-items:flex-start;padding:7px 8px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.memory-copy{flex:1;min-width:0}
.memory-key{font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis}
.memory-value{font-size:11px;color:var(--text);line-height:1.4;margin-top:2px;word-break:break-word}
.memory-actions{display:flex;gap:2px}
.memory-action{border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:1px 3px}
.memory-action:hover{color:var(--accent)}
.memory-action.delete:hover{color:#f87171}
.memory-note{font-size:9px;color:var(--muted);line-height:1.4;margin-top:8px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:center;justify-content:center}
.lightbox.show{display:flex}
.lightbox img{max-width:90%;max-height:90vh;border-radius:var(--r)}
.lb-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer}
</style>
</head>
<body>

<div id="api-status">Đang kết nối...</div>

<div class="lightbox" id="lb" onclick="UI.closeLB()">
  <button class="lb-close">✕</button>
  <img id="lb-img" src="" alt="">
</div>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">yumeai</div>
    <div class="search-box">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Tìm hội thoại..." autocomplete="off"
        oninput="UI.filterConversations(this.value)">
    </div>
  </div>
  <div class="slabel">Hội thoại đã lưu</div>
  <div class="conv-list" id="conv-list"></div>
  <div class="sfooter">
    <div class="uav">M</div>
    <div class="uinfo"><div class="uname">Minh</div><div class="uplan">● LOCAL</div></div>
  </div>
</div>

<div class="chat-main">
  <div class="chat-header">
    <div class="char-av-wrap">
      <div class="char-av" id="header-avatar">🌸</div>
      <div class="ondot"></div>
    </div>
    <div class="char-info">
      <div class="char-name-row"><span id="header-name">Yuki</span> <span class="mood-tag">AI character</span></div>
      <div class="char-sub" id="header-role">Đang tải hồ sơ...</div>
    </div>
  </div>

  <div class="messages" id="messages"><div class="datesep">Hôm nay</div></div>

  <div class="suggests">
    <button class="sug-btn" onclick="UI.qs(this.textContent)">🎨 Hỏi về tranh</button>
    <button class="sug-btn" onclick="UI.qs(this.textContent)">🌸 Kể về Tokyo</button>
    <button class="sug-btn" onclick="UI.qs(this.textContent)">😊 Mày thế nào?</button>
  </div>

  <div class="img-bar">
    <button class="img-toggle" onclick="document.getElementById('img-inp').focus()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      Tạo ảnh
    </button>
    <input class="img-inp" id="img-inp" type="text"
      placeholder="Mô tả ảnh... vd: Yuki mặc áo dài đỏ"
      autocomplete="off" autocorrect="off" spellcheck="false"
      onkeydown="if(event.key==='Enter'){event.preventDefault();UI.gen()}">
    <button class="gen-btn" id="gen-btn" onclick="UI.gen()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 7-7 7 7M12 5v14"/></svg>
    </button>
  </div>

  <div class="chat-input-area">
    <div class="input-wrap">
      <textarea class="chat-inp" id="chat-inp" rows="1"
        placeholder="Nhắn với nhân vật..."
        autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="UI.handleKey(event)" oninput="UI.resize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="UI.send()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="input-hint">Enter gửi · Shift+Enter xuống dòng</div>
  </div>

  <div class="gen-overlay" id="gen-overlay">
    <div class="spinner"></div>
    <div class="gen-lbl" id="gen-lbl">Đang tạo ảnh...</div>
  </div>
</div>

<div class="right-panel">
  <div class="psec">
    <div class="plbl">Nhân vật</div>
    <div class="char-profile">
      <div class="big-av" id="profile-avatar">🌸</div>
      <div class="cpname" id="profile-name">Yuki</div>
      <div class="cpsub" id="profile-role">Đang tải...</div>
      <div class="traits" id="profile-traits"></div>
    </div>
  </div>
  <div class="psec">
    <div class="memory-head">
      <div class="plbl">Trí nhớ đã lưu</div>
      <div class="memory-tools">
        <button class="memory-tool" title="Thêm trí nhớ" onclick="UI.addMemory()">＋</button>
        <button class="memory-tool" title="Làm mới" onclick="UI._loadMemory()">↻</button>
      </div>
    </div>
    <div class="memory-list" id="memory-list">
      <div class="memory-empty">Chưa tải trí nhớ.</div>
    </div>
    <div class="memory-note" id="memory-note">Bạn có thể sửa hoặc xoá điều nhân vật nhớ sai.</div>
  </div>
  <div class="psec">
    <div class="plbl">Gợi ý nhanh</div>
    <div class="qbtns">
      <button class="qbtn" onclick="UI.qs('Hôm nay em làm gì?')">🎨 Hỏi về hôm nay</button>
      <button class="qbtn" onclick="UI.qs('Kể về Tokyo đi')">🗼 Hỏi về Tokyo</button>
      <button class="qbtn" onclick="UI.qs('Mày thích nhạc gì?')">🎵 Hỏi về nhạc</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// CONFIG & STATE
// ════════════════════════════════════════
const CFG = {
  API:       location.protocol.startsWith('http') ? location.origin : 'http://localhost:8000',
  USER:      'user_001',
  USER_NAME: 'Minh'
}

const STATE = {
  busy: false,
  online: false,
  comfy: false,
  conversationId: localStorage.getItem('yumeai_conversation_id'),
  personaId: 'yuki',
  personas: [],
  conversations: []
}

const ICONS = { yuki: '🌸', hana: '🌙' }

// ════════════════════════════════════════
// UI NAMESPACE — tất cả hàm public ở đây
// ════════════════════════════════════════
const UI = {
  async init() {
    await UI.checkHealth()
    try {
      await UI._loadPersonas()
      await UI._loadConversations()
    } catch (err) {
      UI._addErr('Không tải được dữ liệu: ' + err.message)
    }
  },

  // ── Health check ────────────────
  async checkHealth() {
    const el = document.getElementById('api-status')
    el.style.opacity = '1'
    try {
      const r = await fetch(`${CFG.API}/health`, { signal: AbortSignal.timeout(3000) })
      const d = await r.json()
      STATE.online = d.ollama === true
      STATE.comfy = d.comfyui === true

      if (d.ollama && d.comfyui) {
        el.className = 'ok'
        el.textContent = '🟢 Local AI sẵn sàng'
      } else if (d.ollama) {
        el.className = 'ok'
        el.textContent = '🟡 Ollama OK · ComfyUI chưa chạy'
      } else {
        el.className = 'bad'
        el.textContent = '⚠️ Ollama chưa chạy'
      }
    } catch (err) {
      STATE.online = false
      STATE.comfy = false
      el.className = 'bad'
      el.textContent = '⚠️ Backend chưa chạy'
    }
  },

  async _loadPersonas() {
    const r = await fetch(`${CFG.API}/api/personas`)
    if (!r.ok) throw new Error('Không đọc được danh sách nhân vật')
    STATE.personas = (await r.json()).personas || []
  },

  async _loadConversations() {
    await UI._fetchConversations()
    // Lần chạy đầu: tạo một hội thoại cho mỗi persona dựng sẵn để sidebar có
    // điểm vào thật, thay cho hai item mock trước đây.
    if (!STATE.conversations.length) {
      for (const persona of STATE.personas) {
        const r = await fetch(`${CFG.API}/api/conversations`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: CFG.USER,
            user_name: CFG.USER_NAME,
            persona_id: persona.id
          })
        })
        if (!r.ok) throw new Error(`Không tạo được hội thoại với ${persona.name}`)
      }
      await UI._fetchConversations()
    }

    const selected = STATE.conversations.find(c => c.id === STATE.conversationId)
      || STATE.conversations[0]
    if (selected) await UI.openConversation(selected.id)
  },

  async _fetchConversations() {
    const r = await fetch(`${CFG.API}/api/conversations?user_id=${encodeURIComponent(CFG.USER)}`)
    if (!r.ok) throw new Error('Không đọc được lịch sử hội thoại')
    STATE.conversations = (await r.json()).conversations || []
    UI._renderConversations()
  },

  _renderConversations() {
    const list = document.getElementById('conv-list')
    list.replaceChildren()
    for (const conv of STATE.conversations) {
      const item = document.createElement('div')
      item.className = 'conv-item' + (conv.id === STATE.conversationId ? ' active' : '')
      item.onclick = () => UI.openConversation(conv.id)

      const avatar = document.createElement('div')
      avatar.className = 'cav'
      avatar.textContent = ICONS[conv.character_id] || '✦'

      const info = document.createElement('div')
      info.className = 'cinfo'
      const name = document.createElement('div')
      name.className = 'cname'
      name.textContent = conv.character_name
      const last = document.createElement('div')
      last.className = 'clast'
      last.textContent = UI._lastMessageLabel(conv.last_message)
      info.append(name, last)

      const meta = document.createElement('div')
      meta.className = 'cmeta'
      const time = document.createElement('div')
      time.className = 'ctime'
      time.textContent = UI._shortDate(conv.updated_at)
      meta.appendChild(time)
      item.append(avatar, info, meta)
      list.appendChild(item)
    }
  },

  filterConversations(query) {
    const normalized = String(query || '').trim().toLocaleLowerCase('vi-VN')
    for (const item of document.querySelectorAll('.conv-item')) {
      const text = item.textContent.toLocaleLowerCase('vi-VN')
      item.style.display = !normalized || text.includes(normalized) ? '' : 'none'
    }
  },

  async openConversation(conversationId) {
    const r = await fetch(
      `${CFG.API}/api/conversations/${encodeURIComponent(conversationId)}`
      + `?user_id=${encodeURIComponent(CFG.USER)}`
    )
    if (!r.ok) throw new Error('Không mở được hội thoại')
    const data = await r.json()
    STATE.conversationId = conversationId
    STATE.personaId = data.conversation.character_id
    localStorage.setItem('yumeai_conversation_id', conversationId)
    UI._renderConversations()
    UI._renderProfile()
    UI._renderMessages(data.messages || [])
    await UI._loadMemory()
  },

  _renderProfile() {
    const persona = STATE.personas.find(p => p.id === STATE.personaId) || {}
    const icon = ICONS[STATE.personaId] || '✦'
    document.getElementById('header-avatar').textContent = icon
    document.getElementById('header-name').textContent = persona.name || STATE.personaId
    document.getElementById('header-role').textContent = persona.role || ''
    document.getElementById('profile-avatar').textContent = icon
    document.getElementById('profile-name').textContent = persona.name || STATE.personaId
    document.getElementById('profile-role').textContent = `${persona.age || '?'} tuổi · ${persona.role || ''}`
    document.getElementById('chat-inp').placeholder = `Nhắn với ${persona.name || 'nhân vật'}...`

    const traits = document.getElementById('profile-traits')
    traits.replaceChildren()
    for (const like of (persona.likes || []).slice(0, 4)) {
      const tag = document.createElement('span')
      tag.className = 'trait'
      tag.textContent = like
      traits.appendChild(tag)
    }
  },

  _renderMessages(messages) {
    const box = document.getElementById('messages')
    box.replaceChildren()
    const date = document.createElement('div')
    date.className = 'datesep'
    date.textContent = 'Hội thoại đã lưu'
    box.appendChild(date)
    for (const msg of messages) {
      if (msg.content_type === 'image') {
        try {
          const data = JSON.parse(msg.content)
          UI._addImage(UI._absoluteUrl(data.image_url), data.prompt || 'Ảnh đã tạo', msg.created_at)
        } catch (err) {
          UI._addErr('Một ảnh cũ có metadata không hợp lệ')
        }
      } else {
        UI._addMsg(msg.role === 'user' ? 'user' : 'ai', msg.content, msg.created_at)
      }
    }
    UI._scroll()
  },

  async _loadMemory() {
    const list = document.getElementById('memory-list')
    try {
      const url = `${CFG.API}/api/memory?user_id=${encodeURIComponent(CFG.USER)}`
        + `&persona_id=${encodeURIComponent(STATE.personaId)}`
      const r = await fetch(url)
      if (!r.ok) throw new Error('HTTP ' + r.status)
      const data = await r.json()
      UI._renderMemory(data.facts || [])
      document.getElementById('memory-note').textContent = data.auto_extraction
        ? `Tự cập nhật mỗi ${data.extraction_every_messages} tin nhắn · có thể sửa/xoá`
        : 'Tự trích xuất đang tắt · bạn vẫn có thể thêm thủ công'
    } catch (err) {
      list.replaceChildren()
      const empty = document.createElement('div')
      empty.className = 'memory-empty'
      empty.textContent = 'Không tải được trí nhớ: ' + err.message
      list.appendChild(empty)
    }
  },

  _renderMemory(facts) {
    const list = document.getElementById('memory-list')
    list.replaceChildren()
    if (!facts.length) {
      const empty = document.createElement('div')
      empty.className = 'memory-empty'
      empty.textContent = 'Chưa có fact nào. Chat thêm hoặc bấm ＋ để thêm.'
      list.appendChild(empty)
      return
    }
    for (const fact of facts) {
      const item = document.createElement('div')
      item.className = 'memory-item'
      const copy = document.createElement('div')
      copy.className = 'memory-copy'
      const key = document.createElement('div')
      key.className = 'memory-key'
      key.textContent = fact.fact_key.replaceAll('_', ' ')
      const value = document.createElement('div')
      value.className = 'memory-value'
      value.textContent = fact.fact_value
      copy.append(key, value)

      const actions = document.createElement('div')
      actions.className = 'memory-actions'
      const edit = document.createElement('button')
      edit.className = 'memory-action'
      edit.title = 'Sửa'
      edit.textContent = '✎'
      edit.onclick = () => UI.editMemory(fact.fact_key, fact.fact_value)
      const remove = document.createElement('button')
      remove.className = 'memory-action delete'
      remove.title = 'Xoá'
      remove.textContent = '×'
      remove.onclick = () => UI.deleteMemory(fact.fact_key)
      actions.append(edit, remove)
      item.append(copy, actions)
      list.appendChild(item)
    }
  },

  async addMemory() {
    const key = prompt('Tên ngắn cho trí nhớ (ví dụ: favorite_drink):')
    if (!key || !key.trim()) return
    await UI.editMemory(key.trim(), '')
  },

  async editMemory(key, oldValue) {
    const value = prompt('Nhân vật nên nhớ điều gì?', oldValue || '')
    if (value === null || !value.trim()) return
    try {
      const r = await fetch(`${CFG.API}/api/memory/${encodeURIComponent(key)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: CFG.USER,
          persona_id: STATE.personaId,
          value: value.trim(),
          confidence: 1
        })
      })
      if (!r.ok) throw new Error('HTTP ' + r.status)
      await UI._loadMemory()
    } catch (err) {
      UI._addErr('Không lưu được trí nhớ: ' + err.message)
    }
  },

  async deleteMemory(key) {
    if (!confirm(`Xoá trí nhớ “${key.replaceAll('_', ' ')}”?`)) return
    try {
      const url = `${CFG.API}/api/memory/${encodeURIComponent(key)}`
        + `?user_id=${encodeURIComponent(CFG.USER)}`
        + `&persona_id=${encodeURIComponent(STATE.personaId)}`
      const r = await fetch(url, { method: 'DELETE' })
      if (!r.ok) throw new Error('HTTP ' + r.status)
      await UI._loadMemory()
    } catch (err) {
      UI._addErr('Không xoá được trí nhớ: ' + err.message)
    }
  },

  // ── Send chat message ───────────
  async send() {
    if (STATE.busy) return
    const inp = document.getElementById('chat-inp')
    const txt = inp.value.trim()
    if (!txt) return
    if (!STATE.online) {
      UI._addErr('Ollama chưa sẵn sàng. Hãy chạy ollama serve rồi thử lại.')
      return
    }
    if (!STATE.conversationId) {
      UI._addErr('Chưa có cuộc hội thoại được chọn.')
      return
    }

    inp.value = ''
    inp.style.height = 'auto'
    STATE.busy = true
    document.getElementById('send-btn').disabled = true

    UI._addMsg('user', txt)
    UI._showTyping()

    try {
      const res = await fetch(`${CFG.API}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: txt,
          persona_id: STATE.personaId,
          user_id: CFG.USER,
          user_name: CFG.USER_NAME,
          conversation_id: STATE.conversationId
        })
      })
      if (!res.ok) throw new Error('HTTP ' + res.status)

      UI._removeTyping()
      const row = UI._addMsg('ai', '')
      const bbl = row.querySelector('.stream-bbl')
      const reader = res.body.getReader()
      const dec = new TextDecoder()
      let full = ''
      let buffer = ''
      while (true) {
        const { done, value } = await reader.read()
        buffer += dec.decode(value || new Uint8Array(), { stream: !done })
        const events = buffer.split(/\r?\n\r?\n/)
        buffer = events.pop() || ''
        for (const event of events) {
          const line = event.split(/\r?\n/).find(x => x.startsWith('data: '))
          if (!line) continue
          const payload = JSON.parse(line.slice(6))
          if (payload.error) throw new Error(payload.error)
          if (payload.token) {
            full += payload.token
            bbl.textContent = full
            UI._scroll()
          }
        }
        if (done) break
      }
      await UI._fetchConversations()
    } catch (err) {
      UI._removeTyping()
      UI._addErr('Lỗi chat: ' + err.message)
    }

    STATE.busy = false
    document.getElementById('send-btn').disabled = false
  },

  // ── Generate image ──────────────
  async gen() {
    const inp = document.getElementById('img-inp')
    const prompt = inp.value.trim()
    if (!prompt) { inp.focus(); return }
    if (!STATE.comfy) {
      UI._addErr('ComfyUI chưa sẵn sàng. Hãy khởi động ComfyUI rồi thử lại.')
      return
    }

    const overlay = document.getElementById('gen-overlay')
    const btn     = document.getElementById('gen-btn')
    const lbl     = document.getElementById('gen-lbl')

    overlay.classList.add('show')
    btn.disabled = true
    inp.blur()

    try {
      let imgSrc
      lbl.textContent = 'ComfyUI đang vẽ... có thể mất vài phút'
      const res = await fetch(`${CFG.API}/api/images/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          persona_id: STATE.personaId,
          user_id: CFG.USER,
          conversation_id: STATE.conversationId,
          include_base64: false
        })
      })

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}))
        throw new Error(errData.detail || `HTTP ${res.status}`)
      }

      const data = await res.json()
      if (data.image_url) {
        imgSrc = UI._absoluteUrl(data.image_url)
      } else if (data.image_base64) {
        imgSrc = `data:image/png;base64,${data.image_base64}`
      } else {
        throw new Error('Không có ảnh trong response')
      }

      overlay.classList.remove('show')
      lbl.textContent = 'Đang tạo ảnh...'

      UI._addImage(imgSrc, prompt)
      inp.value = ''
      await UI._fetchConversations()
    } catch (err) {
      overlay.classList.remove('show')
      lbl.textContent = 'Đang tạo ảnh...'
      UI._addErr('Tạo ảnh thất bại: ' + err.message)
      console.error(err)
    }

    btn.disabled = false
  },

  // ── Helpers ────────────────────
  qs(txt) {
    document.getElementById('chat-inp').value = txt
    UI.send()
  },

  resize(el) {
    el.style.height = 'auto'
    el.style.height = Math.min(el.scrollHeight, 100) + 'px'
  },

  handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); UI.send() }
  },

  openLB(src) {
    document.getElementById('lb-img').src = src
    document.getElementById('lb').classList.add('show')
  },

  closeLB() {
    document.getElementById('lb').classList.remove('show')
  },

  // ── Private helpers ────────────
  _addMsg(role, txt, createdAt = null) {
    const msgs = document.getElementById('messages')
    const t    = UI._messageTime(createdAt)
    const row  = document.createElement('div')
    row.className = 'mrow' + (role === 'user' ? ' user' : '')

    if (role === 'user') {
      row.innerHTML = `
        <div class="mav uav2">M</div>
        <div class="mbody">
          <div class="bubble user"></div>
          <div class="mtime">${t}</div>
        </div>`
      row.querySelector('.bubble').textContent = txt
    } else {
      row.innerHTML = `
        <div class="mav char">${ICONS[STATE.personaId] || '✦'}</div>
        <div class="mbody">
          <div class="bubble char stream-bbl"></div>
          <div class="mtime">${t}</div>
        </div>`
      row.querySelector('.bubble').textContent = txt
    }
    msgs.appendChild(row)
    UI._scroll()
    return row
  },

  _addImage(src, prompt, createdAt = null) {
    const msgs = document.getElementById('messages')
    const row  = document.createElement('div')
    row.className = 'mrow'

    const safePrompt = String(prompt).replace(/</g, '&lt;').replace(/>/g, '&gt;')

    row.innerHTML = `
      <div class="mav char">${ICONS[STATE.personaId] || '✦'}</div>
      <div class="mbody">
        <div class="bubble char">Đây là ảnh đã tạo theo yêu cầu.</div>
        <div class="bimg">
          <img alt="Generated" style="background:var(--surface);min-height:200px">
          <div class="icap">✨ ${safePrompt}</div>
        </div>
        <div class="mtime">${UI._messageTime(createdAt)}</div>
      </div>`

    const img = row.querySelector('img')
    img.onclick = () => UI.openLB(src)
    img.onload  = () => UI._scroll()
    img.onerror = () => {
      img.parentElement.innerHTML = '<div style="padding:20px;color:#f87171;font-size:12px;text-align:center">⚠️ Không hiển thị được ảnh</div>'
    }
    img.src = src  // set src CUỐI CÙNG để onload/onerror đăng ký trước

    msgs.appendChild(row)
    UI._scroll()
  },

  _showTyping() {
    const msgs = document.getElementById('messages')
    const row  = document.createElement('div')
    row.className = 'mrow'; row.id = 'trow'
    row.innerHTML = `<div class="mav char">${ICONS[STATE.personaId] || '✦'}</div>
      <div class="mbody"><div class="bubble typing">
        <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
      </div></div>`
    msgs.appendChild(row)
    UI._scroll()
  },

  _removeTyping() {
    const el = document.getElementById('trow')
    if (el) el.remove()
  },

  _addErr(msg) {
    const msgs = document.getElementById('messages')
    const d    = document.createElement('div')
    d.className = 'err'
    d.textContent = '⚠️ ' + msg
    msgs.appendChild(d)
    UI._scroll()
  },

  _scroll() {
    const m = document.getElementById('messages')
    m.scrollTop = m.scrollHeight
  },

  _now() {
    return new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
  },

  _messageTime(value) {
    if (!value) return UI._now()
    return new Date(value).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
  },

  _shortDate(value) {
    if (!value) return ''
    const date = new Date(value)
    const today = new Date()
    if (date.toDateString() === today.toDateString()) {
      return date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
    }
    return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })
  },

  _lastMessageLabel(value) {
    if (!value) return 'Chưa có tin nhắn'
    try {
      const data = JSON.parse(value)
      if (data.image_id) return `Ảnh: ${data.prompt || 'đã tạo'}`
    } catch (err) {}
    return value
  },

  _absoluteUrl(value) {
    if (!value || /^https?:\/\//.test(value) || value.startsWith('data:')) return value
    return `${CFG.API}${value.startsWith('/') ? '' : '/'}${value}`
  },

  _delay(ms) {
    return new Promise(r => setTimeout(r, ms))
  }
}

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
UI.init()
setInterval(() => UI.checkHealth(), 30000)
</script>
